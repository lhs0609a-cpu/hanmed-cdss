<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414" width="100%" role="img" aria-label="데이터 그래픽"><rect width="760" height="414" fill="#ffffff"/><g transform="translate(12,8)"><text x="0" y="26" font-size="19" font-weight="700" fill="#1f2430">단순추나 10회에 약침을 함께 한 경우 총액이 어디까지 가나</text><circle cx="16" cy="72" r="14" fill="#2f6f6a"/><text x="16" y="77" font-size="13" fill="#fff" text-anchor="middle">1</text><line x1="16" y1="88" x2="16" y2="110" stroke="#e5e7eb" stroke-width="2"/><text x="44" y="70" font-size="15" fill="#1f2430">기준값 단순추나 1회 전국 중간 27,650원</text><text x="44" y="90" font-size="13" fill="#6b7280">심평원 비급여 공개 신고값(적용 2026-10-05)</text><circle cx="16" cy="126" r="14" fill="#2f6f6a"/><text x="16" y="131" font-size="13" fill="#fff" text-anchor="middle">2</text><line x1="16" y1="142" x2="16" y2="164" stroke="#e5e7eb" stroke-width="2"/><text x="44" y="124" font-size="15" fill="#1f2430">중간 계산값 단순추나 10회 276,500원</text><text x="44" y="144" font-size="13" fill="#6b7280">27,650 × 10 — 계산값이지 어느 기관의 청구액이 아니다</text><circle cx="16" cy="180" r="14" fill="#2f6f6a"/><text x="16" y="185" font-size="13" fill="#fff" text-anchor="middle">3</text><line x1="16" y1="196" x2="16" y2="218" stroke="#e5e7eb" stroke-width="2"/><text x="44" y="178" font-size="15" fill="#1f2430">중간 계산값 복잡추나였다면 10회 458,200원</text><text x="44" y="198" font-size="13" fill="#6b7280">45,820 × 10 — 행위가 달라지면 여기로 옮겨 간다</text><circle cx="16" cy="234" r="14" fill="#2f6f6a"/><text x="16" y="239" font-size="13" fill="#fff" text-anchor="middle">4</text><line x1="16" y1="250" x2="16" y2="272" stroke="#e5e7eb" stroke-width="2"/><text x="44" y="232" font-size="15" fill="#1f2430">공제·차감 없음 0원</text><text x="44" y="252" font-size="13" fill="#6b7280">비급여라 공단 부담분이 없다</text><circle cx="16" cy="288" r="14" fill="#2f6f6a"/><text x="16" y="293" font-size="13" fill="#fff" text-anchor="middle">5</text><line x1="16" y1="304" x2="16" y2="326" stroke="#e5e7eb" stroke-width="2"/><text x="44" y="286" font-size="15" fill="#1f2430">기납부·선차감 없음 0원</text><text x="44" y="306" font-size="13" fill="#6b7280">비급여라 본인부담 상한도 적용되지 않는다</text><circle cx="16" cy="342" r="14" fill="#2f6f6a"/><text x="16" y="347" font-size="13" fill="#fff" text-anchor="middle">6</text><text x="44" y="340" font-size="15" fill="#1f2430">최종값 단순추나 10회 + 약침 10회 526,500원</text><text x="44" y="360" font-size="13" fill="#6b7280">276,500 + 250,000. 같은 날 약침술(경혈) 전국 중간 25,000원을 10회 더한 값</text></g><text x="0" y="394" font-size="12" fill="#6b7280">심평원 비급여 진료비용 정보(적용 2026-10-05) · 1회 신고값 외에는 모두 계산값 · 확인 2026-10-19</text></svg>