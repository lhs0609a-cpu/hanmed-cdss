  <!-- 3D 스쿼클: 그라디언트 바디 + 상단 하이라이트 + 하단 내부 음영 -->
  <rect x="3" y="3" width="58" height="58" rx="17" fill="url(#g)"/>
  <rect x="3" y="3" width="58" height="58" rx="17" fill="url(#sh)"/>
  <rect x="3" y="3" width="58" height="58" rx="17" fill="url(#hl)"/>
