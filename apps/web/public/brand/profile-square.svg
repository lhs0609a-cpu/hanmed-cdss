<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="온고지신 AI">
  <title>온고지신 AI</title>
  <!--
    소셜 프로필 사진(페이스북·인스타그램).

    페이스북은 정사각형을 받아 원으로 잘라낸다. 그래서 모서리 여백 없이
    브랜드 블루로 꽉 채운다(full-bleed) — 여백을 두면 잘린 자리에 흰 띠가
    돈다. 마크는 원 안전영역(중심에서 반경 45%) 안에만 둔다.

    마크 기하는 favicon.svg / Logo.tsx 와 같다. 촌관척(寸關尺) — 아래 선은
    끊이지 않고 흘러온 맥(故), 위 점 셋은 거기서 값을 읽는 자리(新).
    다만 프로필은 피드에서 40px 남짓으로 보이므로 파비콘보다 1.13배 키웠다.
    더 키우면 원에 닿아 답답해지고, 그대로 두면 파란 판만 보인다.

    글자를 넣지 않는다. 페이지 이름이 바로 옆에 나오므로 마크 안에서 또
    이름을 말할 이유가 없고, 40px 에서 한글 네 자는 뭉개진다.
  -->
  <rect width="1024" height="1024" fill="#3182F6"/>

  <g transform="translate(512 512) scale(18.08) translate(-32 -32.5)">
    <g fill="#ffffff">
      <path d="M13.3 40.2 H50.7" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="23" cy="30.9" r="3"/>
      <circle cx="32" cy="28.5" r="3.7"/>
      <circle cx="41" cy="26.1" r="3.2"/>
    </g>
  </g>
</svg>
