<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1633"/>
      <stop offset="55%" stop-color="#122152"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 배경 한자 워터마크 (온고지신 溫故知新) -->
  <text x="1180" y="600" font-family="'Noto Serif KR', 'Batang', 'Apple SD Gothic Neo', serif" font-weight="700" font-size="520"
        text-anchor="end" fill="#ffffff" opacity="0.05">溫故知新</text>

  <!--
    브랜드 마크: 촌관척(寸關尺) — 진맥할 때 손목에 얹는 세 자리 — 선은 맥(故), 점 셋은 값을 읽는 자리(新).
    64×64 좌표계를 1.5배 확대해 96×96 으로 놓는다 — favicon.svg / Logo.tsx 와 같은 기하.
  -->
  <g transform="translate(80, 88) scale(1.5)">
    <rect x="3" y="3" width="58" height="58" rx="17" fill="#3182F6"/>
    <g fill="#ffffff">
      <path d="M13.3 40.2 H50.7" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="23" cy="30.9" r="3"/>
      <circle cx="32" cy="28.5" r="3.7"/>
      <circle cx="41" cy="26.1" r="3.2"/>
    </g>
  </g>

  <!-- 제품명 -->
  <text x="80" y="320" font-family="'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-weight="800" font-size="92"
        fill="#ffffff">온고지신 AI</text>

  <!-- 설명 -->
  <text x="80" y="395" font-family="'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-weight="500" font-size="36"
        fill="#ffffff" opacity="0.92">한의학 임상 의사결정 지원 시스템</text>

  <!-- 카드형 핵심 기능 영역 -->
  <g transform="translate(80, 460)" font-family="'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
    <rect width="1040" height="100" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <text x="40" y="50" font-size="26" font-weight="600" fill="#ffffff">AI 변증</text>
    <text x="40" y="82" font-size="20" fill="#ffffff" opacity="0.85">증상 → 처방 추천</text>

    <text x="280" y="50" font-size="26" font-weight="600" fill="#ffffff">치험례 6,000건</text>
    <text x="280" y="82" font-size="20" fill="#ffffff" opacity="0.85">유사 사례 검색</text>

    <text x="580" y="50" font-size="26" font-weight="600" fill="#ffffff">약물 상호작용</text>
    <text x="580" y="82" font-size="20" fill="#ffffff" opacity="0.85">안전성 검사</text>

    <text x="860" y="50" font-size="26" font-weight="600" fill="#ffffff">음성 차트</text>
    <text x="860" y="82" font-size="20" fill="#ffffff" opacity="0.85">STT → SOAP</text>
  </g>
</svg>
