# fly.toml - Fly.io 배포 설정
app = "hanmed-ai-engine"
primary_region = "nrt"  # Tokyo (한국에서 가장 가까운 리전)

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # 콜드스타트 금지 — 잠들어 있으면 API 쪽 30초 타임아웃에 걸려
  # 그라운딩·임산부 금기 가드가 빠진 폴백 추론으로 응답이 나간다(환자 안전 이슈).
  # 항상 1대는 깨어 있어야 정상 경로가 보장된다.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # 헬스체크 — 엔진이 살아 있는지 Fly 가 알아야 죽은 인스턴스로 라우팅하지 않는다.
  # 체크가 없으면 프로세스가 떠 있기만 해도 정상으로 취급된다.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[env]
  ENVIRONMENT = "production"
  DEBUG = "false"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
