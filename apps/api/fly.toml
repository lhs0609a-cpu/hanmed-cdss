# 온고지신 AI - Fly.io 배포 설정
app = "hanmed-api"
primary_region = "nrt"  # Tokyo (한국에서 가장 가까운 리전)

[build]
  dockerfile = "Dockerfile"

# 배포 전 마이그레이션 적용 — 실패 시 배포 중단(구버전 유지).
# 부팅 시 migrationsRun:true 는 안전망으로 유지되며, 이미 적용된 건 no-op.
[deploy]
  release_command = "node dist/database/migrate.js"

[env]
  NODE_ENV = "production"
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false  # 항상 실행 (결제 웹훅, 스케줄러)
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    port = 3001
    type = "http"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    path = "/api/v1/health"
