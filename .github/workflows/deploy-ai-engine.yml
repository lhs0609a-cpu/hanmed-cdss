name: Deploy AI Engine to Fly.io

# 수동 실행 전용이다. push 트리거를 일부러 넣지 않았다.
#
# ci.yml 주석에 적힌 경계를 그대로 따른다 — 검증된 적 없는 배포 경로가
# 조용히 열리면, 어느 날 무심코 한 푸시가 운영을 바꾸고 아무도 그걸 모른다.
# 여기서는 사람이 Actions 탭에서 버튼을 눌러야만 돈다.
#
# 이 파일이 필요한 이유:
# AI 엔진은 apps/api 와 달리 자동 배포가 없어서 지금까지 로컬에서
# `flyctl deploy` 로 올렸다. 그런데 소속 조직이 SSO 를 요구하면서 개인
# 액세스 토큰 발급이 막혔고(대시보드에서 아예 버튼이 없다), 헤드리스
# 환경에서는 `flyctl auth login` 의 브라우저 흐름도 못 탄다. 결국 로컬에서
# 배포할 방법이 사라졌다. 레포에는 이미 FLY_API_TOKEN 시크릿이 있으므로
# (deploy-backend.yml 이 쓰는 중) 그것으로 배포한다.

on:
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        working-directory: apps/ai-engine
        run: flyctl deploy --remote-only

      - name: Health Check
        # 실패를 삼키지 않는다. 앱이 안 떠도 배포가 성공으로 보이면
        # 그 초록색은 아무 의미가 없다 — deploy-backend.yml 과 같은 이유다.
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf --max-time 10 https://hanmed-ai-engine.fly.dev/health; then
              echo ""
              echo "health ok (attempt $i)"
              exit 0
            fi
            echo "health 대기중... ($i/6)"
            sleep 10
          done
          echo "1분 동안 health 응답 없음 — 배포 실패로 처리한다."
          exit 1

      - name: Verify case list paywall
        # 이 배포의 목적 자체가 "인증 없이 목록을 통째로 가져가는 경로"를
        # 막는 것이다. 앱이 떴다는 것만으로는 그게 됐는지 알 수 없으므로
        # 무료 창 너머를 실제로 찔러 보고 402 가 오는지 확인한다.
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://hanmed-ai-engine.fly.dev/api/v1/cases/list?page=10&limit=100")
          echo "page=10&limit=100 -> $code"
          if [ "$code" != "402" ]; then
            echo "무료 창 너머가 여전히 열려 있다 (기대: 402). 배포가 반영되지 않았다."
            exit 1
          fi
          echo "목록 유료화 반영 확인"
