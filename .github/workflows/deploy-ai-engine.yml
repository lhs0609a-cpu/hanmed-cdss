name: Deploy AI Engine to Fly.io

# 수동 실행 전용이다. push 트리거를 일부러 넣지 않았다.
#
# ci.yml 주석에 적힌 경계를 그대로 따른다 — 검증된 적 없는 배포 경로가
# 조용히 열리면, 어느 날 무심코 한 푸시가 운영을 바꾸고 아무도 그걸 모른다.
# 여기서는 사람이 Actions 탭에서 버튼을 눌러야만 돈다.
#
# 이 파일이 필요한 이유:
# AI 엔진은 apps/api 와 달리 자동 배포가 없어서 지금까지 로컬에서
# `flyctl deploy` 로 올렸다. 그런데 소속 조직이 SSO 를 요구하면서 개인
# 액세스 토큰 발급이 막혔고(대시보드에서 아예 버튼이 없다), 헤드리스
# 환경에서는 `flyctl auth login` 의 브라우저 흐름도 못 탄다. 결국 로컬에서
# 배포할 방법이 사라졌다. 레포에는 이미 FLY_API_TOKEN 시크릿이 있으므로
# (deploy-backend.yml 이 쓰는 중) 그것으로 배포한다.

on:
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        working-directory: apps/ai-engine
        run: flyctl deploy --remote-only

      - name: Health Check
        # commit 을 찍되 불일치로 실패시키지는 않는다 — deploy-backend.yml 과
        # 같은 이유다. 이 배포가 제대로 갔는지는 아래 페이월 검증이 실제 동작으로
        # 확인하므로, 여기서는 앱이 떴는지만 본다.
        run: |
          for i in $(seq 1 12); do
            body=$(curl -sf --max-time 10 https://hanmed-ai-engine.fly.dev/health || true)
            if [ -n "$body" ]; then
              commit=$(echo "$body" | grep -o '"commit":"[^"]*"' | head -1 | cut -d'"' -f4)
              echo "health ok (시도 $i) — 떠 있는 커밋: ${commit:-표시없음}"
              exit 0
            fi
            echo "health 대기중... ($i/12)"
            sleep 10
          done
          echo "2분 동안 health 응답 없음 — 배포 실패로 처리한다."
          exit 1

      - name: Verify case list paywall
        # 이 배포의 목적 자체가 "인증 없이 목록을 통째로 가져가는 경로"를
        # 막는 것이다. 앱이 떴다는 것만으로는 그게 됐는지 알 수 없으므로
        # 실제로 찔러 본다.
        #
        # 방어가 두 겹이라 세 번 찌른다. 처음에는 limit=100 하나로만 확인하려
        # 했는데 그건 틀렸다 — 그 요청은 페이월에 닿기도 전에 파라미터 검증에서
        # 422 로 걸리고, 페이월이 실제로 도는지는 아무것도 말해 주지 않는다.
        # 무료 창 안쪽까지 확인하는 이유는, 과하게 잠가 놓고 "막혔으니 성공"
        # 이라고 읽는 실패를 막기 위해서다.
        run: |
          probe() {
            curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              "https://hanmed-ai-engine.fly.dev/api/v1/cases/list?$1"
          }

          big=$(probe "page=1&limit=100")
          beyond=$(probe "page=10&limit=20")
          inside=$(probe "page=3&limit=20")

          echo "page=1&limit=100 -> $big     (기대 422 · 페이지 크기 상한)"
          echo "page=10&limit=20 -> $beyond  (기대 402 · 무료 창 너머)"
          echo "page=3&limit=20  -> $inside  (기대 200 · 무료 창 안)"

          fail=0
          [ "$big" = "422" ]    || { echo "페이지 크기 상한이 안 걸린다"; fail=1; }
          [ "$beyond" = "402" ] || { echo "무료 창 너머가 여전히 열려 있다"; fail=1; }
          [ "$inside" = "200" ] || { echo "무료 창 안까지 막혔다 — 과하게 잠겼다"; fail=1; }
          if [ "$fail" != "0" ]; then
            echo "배포가 반영되지 않았거나 한도가 어긋났다."
            exit 1
          fi
          echo "목록 유료화 반영 확인"
