name: CI/CD Pipeline

# 이 파이프라인은 오랫동안 한 줄도 실행되지 않았다.
# 레포는 pnpm 인데(pnpm-lock.yaml 만 있다) 모든 잡이 `cache: npm` + `npm ci`
# 로 시작해서, 매 푸시마다 20초쯤 뒤 Setup Node 단계에서
# "Dependencies lock file is not found" 로 죽었다. lint·test·build·audit 이
# 전부 실패 또는 skip 이었고, master 는 늘 빨간 X 였다. 늘 빨가면 아무도
# 안 본다 — deploy-backend.yml 주석에 적힌 것과 같은 실패다.
#
# 웹 배포는 이 파일이 아니라 Vercel 깃 연동이 담당한다. 여기 있던 Vercel
# 배포 잡은 한 번도 실행된 적이 없어(needs 가 항상 실패했다) 검증된 적도
# 없다. 그걸 지금 되살리면 검증 안 된 두 번째 배포 경로가 갑자기 열린다.
# 그래서 이 파일은 검증 전용으로 둔다.

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # 코드 품질 검사
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # packageManager 필드(pnpm@9.15.4)에서 버전을 읽는다.
      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint API
        run: pnpm --filter @hanmed/api lint

      - name: Lint Web
        run: pnpm --filter @hanmed/web lint

  # API 단위 테스트
  test-api:
    name: API Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API tests
        # `run test -- --args` 는 pnpm 버전에 따라 인자 전달이 달라진다.
        # jest 를 직접 부르면 그 모호함이 없다.
        run: pnpm --filter @hanmed/api exec jest --coverage --passWithNoTests --ci
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/api/coverage/lcov.info
          flags: api
          fail_ci_if_error: false

  # 웹 빌드 (타입 체크 포함 — build 스크립트가 tsc -b 를 먼저 돌린다)
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        run: pnpm --filter @hanmed/web build
        env:
          VITE_API_URL: https://api.example.com

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/dist
          retention-days: 7

  # API 빌드 (nest build = tsc, 타입 체크를 겸한다)
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @hanmed/api build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: apps/api/dist
          retention-days: 7

  # 보안 취약점 검사 — 참고용이라 실패해도 넘어간다.
  # 여기를 차단으로 바꾸려면 먼저 현재 취약점을 정리해야 한다.
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

  # E2E 테스트 (master 푸시에서만)
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build-web, build-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter @hanmed/web exec playwright install --with-deps chromium

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/dist

      - name: Run E2E tests
        run: pnpm --filter @hanmed/web test:e2e
        continue-on-error: true

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
