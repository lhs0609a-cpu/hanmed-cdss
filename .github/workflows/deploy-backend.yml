name: Deploy Backend to Fly.io

on:
  push:
    branches:
      - master
    paths:
      - 'apps/api/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      # 커밋 SHA 를 빌드 컨텍스트에 써 넣는다.
      #
      # --build-arg 로 넘기려다 배포가 통째로 안 올라갔다(원인은 확인하지 못했고,
      # 그 플래그를 뺀 순간 정상으로 돌아왔다). 배포 명령에는 손대지 않고,
      # Dockerfile 이 COPY 하는 파일에 값을 써 넣는 방식으로 바꿨다.
      - name: Stamp commit SHA
        run: echo "${{ github.sha }}" > apps/api/GIT_SHA

      - name: Deploy to Fly.io
        working-directory: apps/api
        run: flyctl deploy --remote-only

      # 마이그레이션은 앱이 부팅하면서 스스로 적용한다.
      # app.module.ts 의 migrationsRun 이 기본 켜짐이고 migrations 경로가
      # __dirname 기준이라 dist 에서도 찾는다. 실제로 29개가 모두 적용돼 있다.
      #
      # 예전에는 여기서 `flyctl ssh console -C "cd /app && pnpm migration:run"`
      # 을 돌렸는데 한 번도 성공한 적이 없다 — 운영 이미지는 npm 으로 만들어져
      # pnpm 이 없고(exit 127), 설령 고쳐도 migration:run 은 src/*.ts 를 읽는데
      # 운영 이미지에는 dist 만 있고 ts-node 도 없다. 세 겹으로 어긋나 있었다.
      #
      # 그 단계를 지운 이유는 중복이라서만이 아니다. 앱 배포는 성공했는데
      # 뒤따르는 단계가 늘 실패하니 배포 결과가 항상 빨간색이었고, 그러면
      # 진짜 실패를 아무도 못 알아본다.
      #
      # DB_MIGRATIONS_RUN=false 를 운영에 넣으면 이 자동 적용이 꺼진다. 주의.

      - name: Health Check
        # 200 이 왔다는 것만으로는 배포 성공이 아니다.
        #
        # 새 머신이 마이그레이션 실패 등으로 못 뜨면 Fly 는 구버전을 그대로
        # 유지한다. 그 구버전이 /health 에 200 을 돌려주므로, 응답 코드만 보는
        # 검사는 롤백된 배포를 초록색으로 통과시킨다. 실제로 그렇게 실패한
        # 배포를 한참 뒤에야 발견했다.
        #
        # 그래서 응답에 실린 커밋이 방금 밀어 넣은 커밋과 같은지까지 본다.
        run: |
          expected="${{ github.sha }}"
          echo "기대 커밋: $expected"

          for i in $(seq 1 20); do
            body=$(curl -sf --max-time 10 https://api.ongojisin.co.kr/api/v1/health || true)
            got=$(echo "$body" | grep -o '"commit":"[^"]*"' | head -1 | cut -d'"' -f4)

            if [ "$got" = "$expected" ]; then
              echo "배포 확인 — 떠 있는 커밋이 $got (시도 $i)"
              exit 0
            fi

            if [ -z "$body" ]; then
              echo "  [$i/20] 응답 없음 (재시작 중일 수 있음)"
            elif [ -z "$got" ] || [ "$got" = "unknown" ]; then
              echo "  [$i/20] 구버전 응답 (commit=${got:-없음})"
            else
              echo "  [$i/20] 아직 구버전 — 떠 있는 커밋 $got"
            fi
            sleep 15
          done

          echo ""
          echo "5분 동안 새 커밋이 뜨지 않았다. 배포가 롤백됐을 가능성이 높다."
          echo "flyctl logs -a hanmed-api 로 부팅 로그를 확인할 것 —"
          echo "마이그레이션 실패가 가장 흔한 원인이다."
          exit 1

      - name: Notify deployment result
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Fly.io 배포 + 마이그레이션 성공!"
          else
            echo "❌ Fly.io 배포 또는 마이그레이션 실패!"
          fi
