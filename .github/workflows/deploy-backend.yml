name: Deploy Backend to Fly.io

on:
  push:
    branches:
      - master
    paths:
      - 'apps/api/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      # 배포된 커밋을 앱이 스스로 말할 수 있게 fly.toml 에 찍는다.
      #
      # 이미지에 굽는 방법(--build-arg, 파일 COPY)은 두 번 다 배포를 깨뜨렸다.
      # 그래서 빌드는 아예 건드리지 않는다. [env] 는 런타임 환경변수라
      # NODE_ENV/PORT 와 같은 경로로 머신에 실린다 — 이미 검증된 통로다.
      #
      # sed 가 못 맞춰도 fly.toml 이 그대로일 뿐이라 배포는 정상으로 돈다.
      # 그때는 확인 단계가 "commit 없음" 으로 잡아낸다.
      - name: Stamp commit SHA into fly.toml
        working-directory: apps/api
        run: |
          sed -i "/^\[env\]/a\  GIT_SHA = \"${{ github.sha }}\"" fly.toml
          echo "--- [env] 확인 ---"
          sed -n '/^\[env\]/,/^$/p' fly.toml

      # 배포 명령은 오래 돌아간 이 형태를 그대로 둔다. 플래그를 늘리지 않는다.
      - name: Deploy to Fly.io
        working-directory: apps/api
        run: flyctl deploy --remote-only

      # 마이그레이션은 앱이 부팅하면서 스스로 적용한다.
      # app.module.ts 의 migrationsRun 이 기본 켜짐이고 migrations 경로가
      # __dirname 기준이라 dist 에서도 찾는다. 실제로 29개가 모두 적용돼 있다.
      #
      # 예전에는 여기서 `flyctl ssh console -C "cd /app && pnpm migration:run"`
      # 을 돌렸는데 한 번도 성공한 적이 없다 — 운영 이미지는 npm 으로 만들어져
      # pnpm 이 없고(exit 127), 설령 고쳐도 migration:run 은 src/*.ts 를 읽는데
      # 운영 이미지에는 dist 만 있고 ts-node 도 없다. 세 겹으로 어긋나 있었다.
      #
      # 그 단계를 지운 이유는 중복이라서만이 아니다. 앱 배포는 성공했는데
      # 뒤따르는 단계가 늘 실패하니 배포 결과가 항상 빨간색이었고, 그러면
      # 진짜 실패를 아무도 못 알아본다.
      #
      # DB_MIGRATIONS_RUN=false 를 운영에 넣으면 이 자동 적용이 꺼진다. 주의.

      - name: Health Check
        # 200 이 왔다는 것만으로는 배포 성공이 아니다. 새 머신이 못 뜨면 Fly 는
        # 구버전을 유지하고, 그 구버전이 200 을 돌려준다. 그래서 응답에 실린
        # commit 을 같이 찍는다.
        #
        # 이젠 fly.toml 에 SHA 를 찍어 넣으므로 불일치는 곧 구버전이라는 뜻이다.
        # 그때는 실패시킨다. 그러라고 만든 단계다.
        #
        # 다만 commit 이 아예 비어 있으면 경고만 낸다. 스탬프 배선만 떨어졌을 뿐
        # 앱은 멀쩡할 수 있는데, 그것까지 죽이면 배포가 늘 빨간색이 된다.
        # 늘 빨가면 아무도 안 본다 — 이 레포가 이미 한 번 겪은 실패다.
        #
        # 불일치도 재시도한다. 배포 직후에는 구 머신이 아직 드레인 중이라
        # 한 번쯤 옛 SHA 가 잡힐 수 있다. 첫 응답으로 판정하면 멀쩡한 배포가
        # 빨간색이 된다.
        run: |
          seen=""
          for i in $(seq 1 12); do
            body=$(curl -sf --max-time 10 https://api.ongojisin.co.kr/api/v1/health || true)
            if [ -z "$body" ]; then
              echo "health 대기중... ($i/12)"
              sleep 10
              continue
            fi
            commit=$(echo "$body" | grep -o '"commit":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "health ok (시도 $i) — 떠 있는 커밋: ${commit:-표시없음}"
            seen="$commit"
            if [ -z "$commit" ]; then
              echo "::warning::응답에 commit 이 없다. SHA 스탬프가 안 실렸다."
              exit 0
            fi
            if [ "$commit" = "${{ github.sha }}" ]; then
              echo "새 버전 확인됨."
              exit 0
            fi
            echo "아직 구버전이다. 드레인 대기중... ($i/12)"
            sleep 10
          done
          echo "기대 커밋: ${{ github.sha }}"
          if [ -n "$seen" ]; then
            echo "::error::2분이 지나도 구버전($seen)이 떠 있다. 새 머신이 못 뜬 채 Fly 가 이전 버전을 유지한 것이다."
          else
            echo "::error::2분 동안 health 응답이 없다."
          fi
          exit 1

      - name: Notify deployment result
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Fly.io 배포 + 마이그레이션 성공!"
          else
            echo "❌ Fly.io 배포 또는 마이그레이션 실패!"
          fi
