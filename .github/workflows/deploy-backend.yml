name: Deploy Backend to Fly.io

on:
  push:
    branches:
      - master
    paths:
      - 'apps/api/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      # 배포 명령은 오래 돌아간 이 형태를 그대로 둔다.
      #
      # 여기에 --build-arg GIT_SHA=... 를 붙였더니 배포가 통째로 안 올라갔다.
      # 원인을 확인하지 못한 채 다른 플래그로 갈아타면 변수만 하나 더 늘어난다.
      # SHA 를 이미지에 넣는 방법은 이 배포가 다시 도는 것을 확인한 뒤에 붙인다.
      - name: Deploy to Fly.io
        working-directory: apps/api
        run: flyctl deploy --remote-only

      # 마이그레이션은 앱이 부팅하면서 스스로 적용한다.
      # app.module.ts 의 migrationsRun 이 기본 켜짐이고 migrations 경로가
      # __dirname 기준이라 dist 에서도 찾는다. 실제로 29개가 모두 적용돼 있다.
      #
      # 예전에는 여기서 `flyctl ssh console -C "cd /app && pnpm migration:run"`
      # 을 돌렸는데 한 번도 성공한 적이 없다 — 운영 이미지는 npm 으로 만들어져
      # pnpm 이 없고(exit 127), 설령 고쳐도 migration:run 은 src/*.ts 를 읽는데
      # 운영 이미지에는 dist 만 있고 ts-node 도 없다. 세 겹으로 어긋나 있었다.
      #
      # 그 단계를 지운 이유는 중복이라서만이 아니다. 앱 배포는 성공했는데
      # 뒤따르는 단계가 늘 실패하니 배포 결과가 항상 빨간색이었고, 그러면
      # 진짜 실패를 아무도 못 알아본다.
      #
      # DB_MIGRATIONS_RUN=false 를 운영에 넣으면 이 자동 적용이 꺼진다. 주의.

      - name: Health Check
        # 200 이 왔다는 것만으로는 배포 성공이 아니다. 새 머신이 못 뜨면 Fly 는
        # 구버전을 유지하고, 그 구버전이 200 을 돌려준다. 그래서 응답에 실린
        # commit 을 같이 찍는다.
        #
        # 아직 commit 불일치로 실패시키지는 않는다. SHA 를 이미지에 넣는 배선이
        # 아직 없어서(위 주석 참고) 지금은 항상 unknown 이고, 그걸로 잡을 죽이면
        # 배포가 늘 빨간색이 된다. 늘 빨가면 아무도 안 본다 — 이 레포가 이미
        # 한 번 겪은 실패다. 배선이 붙는 순간 이 단계를 불일치=실패로 바꾼다.
        run: |
          for i in $(seq 1 12); do
            body=$(curl -sf --max-time 10 https://api.ongojisin.co.kr/api/v1/health || true)
            if [ -n "$body" ]; then
              commit=$(echo "$body" | grep -o '"commit":"[^"]*"' | head -1 | cut -d'"' -f4)
              echo "health ok (시도 $i) — 떠 있는 커밋: ${commit:-표시없음}"
              echo "기대 커밋: ${{ github.sha }}"
              if [ -z "$commit" ]; then
                echo "::warning::응답에 commit 이 없다. 구버전이 떠 있을 수 있다."
              fi
              exit 0
            fi
            echo "health 대기중... ($i/12)"
            sleep 10
          done
          echo "2분 동안 health 응답 없음 — 배포 실패로 처리한다."
          exit 1

      - name: Notify deployment result
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Fly.io 배포 + 마이그레이션 성공!"
          else
            echo "❌ Fly.io 배포 또는 마이그레이션 실패!"
          fi
